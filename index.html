<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Test Store</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
    margin: 0;
    padding: 0;
    color: #222;
  }
  header {
    background: #222;
    color: #fff;
    padding: 24px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 8px 0 0; color: #ccc; }

  .products {
    max-width: 900px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 0 20px;
  }
  .product {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    text-align: center;
  }
  .product img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 8px;
    background: #ddd;
  }
  .product h3 { margin: 12px 0 4px; }
  .product .price { color: #555; font-weight: bold; margin-bottom: 10px; }

  form {
    max-width: 500px;
    margin: 40px auto;
    background: #fff;
    padding: 24px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  form h2 { margin-top: 0; }
  label { display: block; margin: 14px 0 6px; font-weight: bold; }
  input, select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #222;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #444; }

  footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>My Test Store</h1>
  <p>Pick something you like, and I'll call you to confirm your order.</p>
</header>

<section class="products">
  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Product+1" alt="Product 1">
    <h3>Sample T-Shirt</h3>
    <p class="price">$15</p>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Product+2" alt="Product 2">
    <h3>Sample Cap</h3>
    <p class="price">$10</p>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Product+3" alt="Product 3">
    <h3>Sample Mug</h3>
    <p class="price">$8</p>
  </div>
</section>

<!-- Netlify Forms: the "data-netlify" attribute is what makes Netlify collect this automatically -->
<form name="order" method="POST" data-netlify="true">
  <input type="hidden" name="form-name" value="order" />

  <h2>Place Your Order</h2>

  <label for="product">Which item do you want?</label>
  <select id="product" name="product" required>
    <option value="">-- Choose an item --</option>
    <option value="T-Shirt ($15)">T-Shirt ($15)</option>
    <option value="Cap ($10)">Cap ($10)</option>
    <option value="Mug ($8)">Mug ($8)</option>
  </select>

  <label for="name">Your Name</label>
  <input type="text" id="name" name="name" required placeholder="John Doe">

  <label for="phone">Phone Number</label>
  <input type="tel" id="phone" name="phone" required placeholder="+1 555 123 4567">

  <label for="notes">Anything else? (optional)</label>
  <textarea id="notes" name="notes" rows="3" placeholder="e.g. preferred size, color, delivery address"></textarea>

  <button type="submit">Submit Order</button>
</form>

<footer>
  This is a test page. No real payment is processed here.
</footer>

</body>
</html>
